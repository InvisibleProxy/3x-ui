services:
  xray:
    build:
      context: .
      dockerfile: ./Dockerfile.xray
      platforms:
        - linux/amd64
      args:
        - XRAY_VERSION=25.10.15
    container_name: 3x-ui-xray
    restart: unless-stopped
    networks:
      3x-ui-net:
        ipv4_address: 172.25.0.10
    ports:
      - "443:443"
      - "10085:10085"
    volumes:
      - ./web/service/xray.template.json:/etc/xray/config.json:ro
      - xray-logs:/var/log/xray
      - xray-assets:/usr/local/share/xray
    environment:
      - XRAY_CORE_VERSION=25.10.15
      - XRAY_LOCATION_ASSET=/usr/local/share/xray
      - TZ=Asia/Tehran
    healthcheck:
      test: ["CMD", "pidof", "xray"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  3x-ui:
    build:
      context: .
      dockerfile: ./Dockerfile.ui
      platforms:
        - linux/amd64
      args:
        - XRAY_VERSION=25.10.15
    container_name: 3x-ui-web
    restart: unless-stopped
    depends_on:
      xray:
        condition: service_healthy
    networks:
      - 3x-ui-net
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    ports:
      - "2053:2053"
      - "2096:2096"
    volumes:
      - $PWD/db/:/etc/x-ui/
      - $PWD/cert/:/root/cert/
      - ./web/service/config.json:/etc/xray/config.json:ro
      - xray-logs:/var/log/xray:ro
      - xray-assets:/usr/local/share/xray
    environment:
      - XRAY_HOST=xray
      - XRAY_PORT=10085
      - XRAY_VMESS_AEAD_FORCED=false
      - XUI_ENABLE_FAIL2BAN=true
      - XUI_LOG_LEVEL=debug
      - XRAY_BINARY_PATH=/usr/bin/xray
      - XRAY_CONFIG_PATH=/etc/xray/config.json
      - XRAY_LOCATION_ASSET=/usr/local/share/xray
    tty: true

networks:
  3x-ui-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  xray-logs:
  xray-assets:
